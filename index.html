<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#176fa5">
<title>Taiwan Planet</title>
<style>:root { color-scheme: dark; --bg:#061018; --label:#fffdf2; } * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; } body { position:fixed; inset:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC","PingFang TC",sans-serif; } #app,#stage,#labels { position:absolute; inset:0; width:100%; height:100%; touch-action:none; } #app { overflow:hidden; background:radial-gradient(circle at 50% 42%,rgba(53,129,176,.18),transparent 42%), linear-gradient(180deg,#07141e,#02070b); } canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; } body.dragging canvas { cursor:grabbing; } #labels { z-index:3; pointer-events:none; overflow:hidden; } .label { position:absolute; left:0; top:0; transform:translate(-50%,-50%); white-space:nowrap; color:var(--label); font-size:12px; line-height:1; font-weight:700; letter-spacing:.04em; text-shadow:0 1px 3px #000,0 0 9px rgba(0,0,0,.9); opacity:0; will-change:transform,opacity; } .label.pole { font-size:clamp(13px,3.2vw,18px); letter-spacing:.08em; } .label::before { content:""; position:absolute; left:50%; top:calc(100% + 4px); width:3px; height:3px; border-radius:50%; transform:translateX(-50%); background:currentColor; box-shadow:0 0 0 2px rgba(4,18,28,.72); opacity:.76; } #hint { position:absolute; z-index:4; left:50%; transform:translateX(-50%); pointer-events:none; text-align:center; text-shadow:0 1px 3px #000; } #hint { bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px)); color:rgba(244,248,245,.7); font-size:11px; letter-spacing:.08em; white-space:nowrap; transition:opacity .35s ease; } body.interacted #hint { opacity:0; }
#priority-monitor { position:absolute; z-index:5; top:max(18px,calc(env(safe-area-inset-top) + 10px)); right:max(10px,calc(env(safe-area-inset-right) + 8px)); width:clamp(188px,46vw,260px); max-height:74vh; overflow:auto; padding:8px 9px 9px; border:1px solid rgba(223,241,244,.15); border-radius:10px; background:rgba(2,10,15,.72); box-shadow:0 4px 20px rgba(0,0,0,.18); color:rgba(244,248,245,.92); font-size:10px; line-height:1.25; letter-spacing:.02em; touch-action:pan-y; overscroll-behavior:contain; scrollbar-width:none; }
#priority-monitor::-webkit-scrollbar { display:none; }
.monitor-title { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:5px; margin-bottom:4px; border-bottom:1px solid rgba(255,255,255,.10); font-size:11px; font-weight:800; letter-spacing:.08em; }
.monitor-title small { color:rgba(244,248,245,.52); font-size:8px; font-weight:600; letter-spacing:.03em; }
.monitor-group + .monitor-group { margin-top:6px; }
.monitor-section-title { margin:8px 0 4px; padding:5px 0 4px; border-top:1px solid rgba(255,255,255,.12); font-size:10px; font-weight:900; letter-spacing:.10em; }
.monitor-section-title:first-child { margin-top:0; border-top:0; }
.monitor-section-title.boost { color:rgba(140,215,255,.95); }
.monitor-section-title.shrink { color:rgba(255,205,145,.95); }
.monitor-group-title,.monitor-row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.monitor-group-title { padding:2px 0 3px; color:rgba(195,225,235,.82); font-weight:700; }
.monitor-group-title strong { color:#fff; font-size:10px; }
.monitor-row { padding:1px 0; color:rgba(244,248,245,.78); }
.monitor-row > span:last-child { white-space:nowrap; font-variant-numeric:tabular-nums; }
.monitor-row b { color:#fff; font-weight:800; }
.monitor-row i { margin-left:6px; color:rgba(116,195,238,.78); font-style:normal; font-size:9px; font-weight:700; }
.monitor-pair { min-width:86px; text-align:right; }
.monitor-row[data-change="up"] b { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; }
.monitor-row[data-change="down"] b { opacity:.72; }
.monitor-missing { color:rgba(244,248,245,.35); }
</style>
</head>
<body>
<main id="app" aria-label="Taiwan Planet interactive globe"><div id="stage"></div><div id="labels" aria-hidden="true"></div><aside id="priority-monitor" aria-label="重點地區監測"><div class="monitor-title"><span>重點地區監測</span><small>相對 146° 基準</small></div><div id="priority-monitor-body">計算中…</div></aside><div id="hint">單指旋轉・雙指縮放／扭轉</div></main>
<script type="module" src="./feedback/main.js"></script>
</body>
</html>
