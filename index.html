<!doctype html>
<html lang="zh-Hant">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#176fa5"/>
<title>Taiwan Planet</title>
<style>

</style>
</head>
<body>
<main id="app" aria-label="Taiwan Planet interactive globe">
<div id="stage"></div><div id="labels" aria-hidden="true"></div><div id="status">載入台灣行政區…</div><div id="hint">單指旋轉・雙指縮放</div>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

let projectionState=null,labelItems=[];

function featureTownName(f){const p=f.properties||{},d=p.TOWNNAME??p.townname??p.TOWN??p.town??p.NAME??p.name;if(typeof d==="string"&&d.trim())return d.trim().replace(/臺/g,"台");for(const v of Object.values(p)){if(typeof v!=="string")continue;const s=v.trim().replace(/臺/g,"台");if(/[鄉鎮市區]$/u.test(s)&&s.length<=8)return s}return""}

function ringCentroid(r){if(!r?.length)return[999,999];let x=0,y=0,n=0;for(const [a,b] of r){x+=a;y+=b;n++}return n?[x/n,y/n]:[999,999]}

function smoothstep(a,b,x){const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}

function latLonToVector3(latDeg,lonDeg,radius=1){const lat=THREE.MathUtils.degToRad(latDeg),lon=THREE.MathUtils.degToRad(lonDeg);return new THREE.Vector3(radius*Math.cos(lat)*Math.sin(lon),radius*Math.sin(lat),radius*Math.cos(lat)*Math.cos(lon))}
function unwrapRing(r,a=null){if(!r.length)return[];const out=[];let first=r[0][0];if(a!==null)first+=360*Math.round((a-first)/360);out.push([first,r[0][1]]);for(let i=1;i<r.length;i++){let lon=r[i][0],prev=out[i-1][0];while(lon-prev>180)lon-=360;while(lon-prev<-180)lon+=360;out.push([lon,r[i][1]])}return out}
function drawProjectedPolygon(ctx,poly,fill,stroke,lw){if(!poly?.length)return;const projected=poly.map(r=>r.map(([lon,lat])=>geoToPlanet(lon,lat))),outer=unwrapRing(projected[0]),anchor=outer.reduce((a,p)=>a+p[0],0)/Math.max(1,outer.length),rings=[outer,...projected.slice(1).map(r=>unwrapRing(r,anchor))];for(const shift of[-360,0,360]){ctx.beginPath();for(const ring of rings){if(!ring.length)continue;ring.forEach(([lon,lat],i)=>{const x=((lon+shift+90)/360)*TEXTURE_W,y=((90-lat)/180)*TEXTURE_H;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}ctx.fillStyle=fill;ctx.fill("evenodd");ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function drawFeature(ctx,f,i){const target=featureTargetName(f),fills=["#92aa78","#9eae7f","#899f70","#a5b689"],fill=target?"#d0d6a7":fills[i%fills.length],stroke=target?"rgba(255,252,231,.95)":"rgba(243,247,226,.52)",lw=target?2.4:1.05,g=f.geometry;if(g.type==="Polygon")drawProjectedPolygon(ctx,g.coordinates,fill,stroke,lw);else g.coordinates.forEach(p=>drawProjectedPolygon(ctx,p,fill,stroke,lw))}
function buildTexture(features){const c=document.createElement("canvas");c.width=TEXTURE_W;c.height=TEXTURE_H;const ctx=c.getContext("2d",{alpha:false}),sea=ctx.createLinearGradient(0,0,0,TEXTURE_H);sea.addColorStop(0,"#54a9d7");sea.addColorStop(.45,"#2b86bd");sea.addColorStop(1,"#17699f");ctx.fillStyle=sea;ctx.fillRect(0,0,TEXTURE_W,TEXTURE_H);ctx.save();ctx.globalAlpha=.08;ctx.strokeStyle="#e1f5ff";ctx.lineWidth=1;for(let lat=-60;lat<=60;lat+=20){const y=((90-lat)/180)*TEXTURE_H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(TEXTURE_W,y);ctx.stroke()}ctx.restore();features.forEach((f,i)=>drawFeature(ctx,f,i));const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return tex}
function buildLabels(features){labelsLayer.replaceChildren();labelItems=[];for(const f of features){const fullName=featureTownName(f);if(!fullName)continue;const[lon,lat]=centroidOfFeature(f),[pLon,pLat]=geoToPlanet(lon,lat),pole=!!featureTargetName(f),el=document.createElement("div");el.className=`label${pole?" pole":""}`;el.textContent=pole?normalizeName(fullName):fullName;labelsLayer.appendChild(el);labelItems.push({name:fullName,pole,el,local:latLonToVector3(pLat,pLon,RADIUS*1.025)})}}
async function loadTaiwan(){try{const res=await fetch(DATA_URL,{cache:"force-cache"});if(!res.ok)throw new Error(`TopoJSON ${res.status}`);const topology=await res.json(),object=topology.objects.towns||Object.values(topology.objects)[0],collection=topoFeature(topology,object),features=collection.features.map(sanitizeFeature).filter(Boolean);if(!features.length)throw new Error("找不到台灣本島行政區");projectionState=buildProjection(features);oceanMaterial.map=buildTexture(features);oceanMaterial.color.setHex(0xffffff);oceanMaterial.needsUpdate=true;buildLabels(features);statusEl.textContent=`本島行政區 ${features.length} 個`;document.body.classList.add("ready")}catch(err){console.error(err);statusEl.textContent="台灣圖資載入失敗"}}
const pointers=new Map();let lastSingle=null,pinchStartDistance=0,pinchStartCameraZ=camera.position.z;const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),markInteraction=()=>document.body.classList.add("interacted");
function onPointerDown(e){e.preventDefault();markInteraction();renderer.domElement.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});document.body.classList.add("dragging");if(pointers.size===1)lastSingle={x:e.clientX,y:e.clientY};else if(pointers.size===2){const[a,b]=[...pointers.values()];pinchStartDistance=Math.max(1,distance(a,b));pinchStartCameraZ=camera.position.z;lastSingle=null}}
function onPointerMove(e){if(!pointers.has(e.pointerId))return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const p=[...pointers.values()][0];if(lastSingle){world.rotation.y+=(p.x-lastSingle.x)*ROTATION_SPEED;world.rotation.x+=(p.y-lastSingle.y)*ROTATION_SPEED;world.rotation.x=THREE.MathUtils.clamp(world.rotation.x,-1.48,1.48)}lastSingle={...p}}else if(pointers.size===2){const[a,b]=[...pointers.values()],current=Math.max(1,distance(a,b));camera.position.z=THREE.MathUtils.clamp(pinchStartCameraZ*(pinchStartDistance/current),MIN_CAMERA_Z,MAX_CAMERA_Z)}}
function onPointerUp(e){e.preventDefault();pointers.delete(e.pointerId);if(!pointers.size){lastSingle=null;document.body.classList.remove("dragging")}else if(pointers.size===1)lastSingle={...[...pointers.values()][0]}}
["pointerdown","pointermove","pointerup","pointercancel"].forEach(t=>renderer.domElement.addEventListener(t,t==="pointerdown"?onPointerDown:t==="pointermove"?onPointerMove:onPointerUp,{passive:false}));const block=e=>e.preventDefault();["gesturestart","gesturechange","gestureend","contextmenu","dragstart","selectstart"].forEach(t=>document.addEventListener(t,block,{passive:false}));document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});let lastTouchEnd=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=n},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();renderer.setSize(w,h,false);renderer.setPixelRatio(Math.min(devicePixelRatio||1,2))}addEventListener("resize",resize,{passive:true});visualViewport?.addEventListener("resize",resize,{passive:true});resize();
const tmpWorld=new THREE.Vector3(),tmpProjected=new THREE.Vector3(),tmpNormal=new THREE.Vector3(),tmpToCamera=new THREE.Vector3();
function updateLabels(){if(!labelItems.length)return;const w=innerWidth,h=innerHeight,zoom=camera.position.z,limit=zoom<2.55?82:zoom<3.2?48:zoom<4?24:10,cellW=zoom<2.55?72:88,cellH=zoom<2.55?24:28,occupied=new Set(),candidates=[];world.updateMatrixWorld(true);for(const item of labelItems){tmpWorld.copy(item.local).applyMatrix4(world.matrixWorld);tmpNormal.copy(tmpWorld).normalize();tmpToCamera.copy(camera.position).sub(tmpWorld).normalize();const facing=tmpNormal.dot(tmpToCamera);if(facing<=.035){item.el.style.opacity="0";continue}tmpProjected.copy(tmpWorld).project(camera);const sx=(tmpProjected.x*.5+.5)*w,sy=(-tmpProjected.y*.5+.5)*h;if(tmpProjected.z<-1||tmpProjected.z>1||sx<-70||sx>w+70||sy<-40||sy>h+40){item.el.style.opacity="0";continue}candidates.push({item,facing,sx,sy})}candidates.sort((a,b)=>Number(b.item.pole)-Number(a.item.pole)||b.facing-a.facing);let shown=0;for(const c of candidates){const{item,sx,sy,facing}=c,gx=Math.floor(sx/cellW),gy=Math.floor(sy/cellH),k=`${gx}:${gy}`;if(!item.pole&&(shown>=limit||occupied.has(k))){item.el.style.opacity="0";continue}occupied.add(k);shown++;item.el.style.transform=`translate3d(${sx}px,${sy}px,0) translate(-50%,-50%)`;item.el.style.opacity=String(THREE.MathUtils.clamp((facing-.035)*3.2,0,1))}}

</script>
