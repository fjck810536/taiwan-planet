<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#061019" />
  <title>Taiwan Planet</title>
  <style>
    :root { color-scheme: dark; --bg:#03070b; --label:#f4f3e8; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    body { position:fixed; inset:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC","PingFang TC",sans-serif; }
    #app,#stage,#labels { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
    #app { overflow:hidden; background:radial-gradient(circle at 50% 42%,rgba(40,76,91,.18),transparent 40%),linear-gradient(180deg,#07131c,#020509); }
    canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; }
    body.dragging canvas { cursor:grabbing; }
    #labels { z-index:3; pointer-events:none; }
    .label { position:absolute; left:0; top:0; transform:translate(-50%,-50%); white-space:nowrap; color:var(--label); font-size:clamp(12px,3.5vw,18px); line-height:1; font-weight:700; letter-spacing:.08em; text-shadow:0 1px 3px #000,0 0 10px rgba(0,0,0,.82); opacity:0; will-change:transform,opacity; }
    .label::before { content:""; position:absolute; left:50%; top:calc(100% + 5px); width:4px; height:4px; border-radius:50%; transform:translateX(-50%); background:currentColor; box-shadow:0 0 0 2px rgba(5,13,18,.7); opacity:.78; }
    #hint,#status { position:absolute; z-index:4; left:50%; transform:translateX(-50%); pointer-events:none; text-align:center; white-space:nowrap; text-shadow:0 1px 3px #000; }
    #hint { bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px)); color:rgba(240,244,239,.66); font-size:11px; letter-spacing:.08em; transition:opacity .35s ease; }
    #status { top:max(18px,calc(env(safe-area-inset-top) + 10px)); color:rgba(240,244,239,.74); font-size:11px; letter-spacing:.06em; }
    body.interacted #hint { opacity:0; }
    body.ready #status { opacity:0; transition:opacity .4s ease; }
  </style>
</head>
<body>
  <main id="app" aria-label="Taiwan Planet interactive globe">
    <div id="stage"></div>
    <div id="labels" aria-hidden="true"></div>
    <div id="status">載入真正台灣行政區…</div>
    <div id="hint">單指旋轉・雙指縮放</div>
  </main>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
    import { feature as topoFeature } from "https://cdn.jsdelivr.net/npm/topojson-client@3/+esm";

    const DATA_URL = "https://cdn.jsdelivr.net/npm/taiwan-atlas@2021.9.20/towns-10t.json";
    const TARGETS = ["大同","中山","中正","大安","松山","信義"];
    const MAINLAND_BOX = { minLon:120.0, maxLon:122.1, minLat:21.75, maxLat:25.55 };
    const RADIUS = 1;
    const MIN_CAMERA_Z = 2.1;
    const MAX_CAMERA_Z = 5.4;
    const ROTATION_SPEED = 0.0062;
    const TEXTURE_W = 3072;
    const TEXTURE_H = 1536;

    const stage = document.querySelector("#stage");
    const labelsLayer = document.querySelector("#labels");
    const statusEl = document.querySelector("#status");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40,1,.1,100);
    camera.position.set(0,0,3.35);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
    stage.appendChild(renderer.domElement);

    const world = new THREE.Group();
    world.rotation.x = 0.46;
    world.rotation.y = -0.08;
    scene.add(world);

    scene.add(new THREE.HemisphereLight(0xd8e8e9,0x061019,1.55));
    const key = new THREE.DirectionalLight(0xffffff,1.55);
    key.position.set(-2.8,3.5,4.8);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x77b6cb,.68);
    rim.position.set(3.6,-1.7,-3.0);
    scene.add(rim);

    const oceanMaterial = new THREE.MeshStandardMaterial({ color:0x0a2939, roughness:.94, metalness:0 });
    const globe = new THREE.Mesh(new THREE.SphereGeometry(RADIUS,160,112),oceanMaterial);
    world.add(globe);
    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(RADIUS*1.014,120,88),
      new THREE.MeshBasicMaterial({ color:0x77b7ca, transparent:true, opacity:.055, side:THREE.BackSide })
    );
    world.add(atmosphere);

    let labelItems = [];
    let projectionState = null;

    const normalizeName = (value) => String(value ?? "")
      .replace(/臺/g,"台")
      .replace(/[鄉鎮市區]$/u,"")
      .trim();

    function featureTargetName(f) {
      const vals = Object.values(f.properties || {});
      for (const value of vals) {
        const n = normalizeName(value);
        if (TARGETS.includes(n)) return n;
      }
      return null;
    }

    function eachCoordinate(geometry, callback) {
      if (!geometry) return;
      const c = geometry.coordinates;
      if (geometry.type === "Polygon") {
        c.forEach(r => r.forEach(callback));
      } else if (geometry.type === "MultiPolygon") {
        c.forEach(p => p.forEach(r => r.forEach(callback)));
      }
    }

    function centroidOfFeature(f) {
      let sx=0, sy=0, n=0;
      eachCoordinate(f.geometry, ([lon,lat]) => { sx += lon; sy += lat; n++; });
      return n ? [sx/n,sy/n] : [121.54,25.04];
    }

    function isMainIslandFeature(f) {
      const [lon,lat] = centroidOfFeature(f);
      return lon >= MAINLAND_BOX.minLon && lon <= MAINLAND_BOX.maxLon && lat >= MAINLAND_BOX.minLat && lat <= MAINLAND_BOX.maxLat;
    }

    function buildProjection(features) {
      const targets = features.filter(f => featureTargetName(f));
      const targetCenters = targets.map(centroidOfFeature);
      const fallback = [121.544,25.044];
      const center = targetCenters.length
        ? [targetCenters.reduce((a,p)=>a+p[0],0)/targetCenters.length, targetCenters.reduce((a,p)=>a+p[1],0)/targetCenters.length]
        : fallback;
      const cosLat = Math.cos(center[1] * Math.PI/180);
      let maxR = .001;
      for (const f of features) eachCoordinate(f.geometry, ([lon,lat]) => {
        const dx = (lon-center[0]) * cosLat;
        const dy = lat-center[1];
        maxR = Math.max(maxR,Math.hypot(dx,dy));
      });
      return { center, cosLat, maxR };
    }

    function smoothstep(a,b,x) {
      const t = Math.max(0,Math.min(1,(x-a)/(b-a)));
      return t*t*(3-2*t);
    }

    function geoToPlanet(lon,lat) {
      const { center, cosLat, maxR } = projectionState;
      const dx = (lon-center[0]) * cosLat;
      const dy = lat-center[1];
      const r = Math.hypot(dx,dy);
      const t = Math.min(1,r/maxR);
      const colat = Math.PI * Math.pow(t,0.67);
      const rawAzimuth = Math.atan2(dx,-dy);
      const azimuthScale = 1 + 2.15 * smoothstep(.08,.92,t);
      const azimuth = rawAzimuth * azimuthScale;
      const outLat = 90 - colat * 180/Math.PI;
      let outLon = azimuth * 180/Math.PI;
      outLon = ((outLon + 180) % 360 + 360) % 360 - 180;
      return [outLon,outLat];
    }

    function latLonToVector3(latDeg,lonDeg,radius=1) {
      const lat = THREE.MathUtils.degToRad(latDeg);
      const lon = THREE.MathUtils.degToRad(lonDeg);
      return new THREE.Vector3(
        radius*Math.cos(lat)*Math.sin(lon),
        radius*Math.sin(lat),
        radius*Math.cos(lat)*Math.cos(lon)
      );
    }

    function unwrapRing(projectedRing, anchor=null) {
      if (!projectedRing.length) return [];
      const out=[];
      let firstLon=projectedRing[0][0];
      if (anchor !== null) firstLon += 360*Math.round((anchor-firstLon)/360);
      out.push([firstLon,projectedRing[0][1]]);
      for (let i=1;i<projectedRing.length;i++) {
        let lon=projectedRing[i][0];
        const prev=out[i-1][0];
        while (lon-prev>180) lon-=360;
        while (lon-prev<-180) lon+=360;
        out.push([lon,projectedRing[i][1]]);
      }
      return out;
    }

    function drawProjectedPolygon(ctx, polygon, fillStyle, strokeStyle, lineWidth) {
      if (!polygon?.length) return;
      const projected = polygon.map(r => r.map(([lon,lat]) => geoToPlanet(lon,lat)));
      const outer = unwrapRing(projected[0]);
      const anchor = outer.reduce((a,p)=>a+p[0],0)/Math.max(1,outer.length);
      const rings = [outer,...projected.slice(1).map(r => unwrapRing(r,anchor))];
      for (const shift of [-360,0,360]) {
        ctx.beginPath();
        for (const ring of rings) {
          if (!ring.length) continue;
          ring.forEach(([lon,lat],i) => {
            const px = ((lon+shift+90)/360)*TEXTURE_W;
            const py = ((90-lat)/180)*TEXTURE_H;
            if (i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
          });
          ctx.closePath();
        }
        ctx.fillStyle = fillStyle;
        ctx.fill("evenodd");
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
    }

    function drawFeature(ctx,f) {
      const target = featureTargetName(f);
      const fill = target ? "#b9c99b" : "#819d75";
      const stroke = target ? "rgba(251,250,231,.88)" : "rgba(230,240,219,.38)";
      const width = target ? 2.1 : 1.0;
      const g=f.geometry;
      if (g.type === "Polygon") drawProjectedPolygon(ctx,g.coordinates,fill,stroke,width);
      else if (g.type === "MultiPolygon") g.coordinates.forEach(p => drawProjectedPolygon(ctx,p,fill,stroke,width));
    }

    function buildTexture(features) {
      const canvas=document.createElement("canvas");
      canvas.width=TEXTURE_W; canvas.height=TEXTURE_H;
      const ctx=canvas.getContext("2d",{alpha:false});
      const sea=ctx.createLinearGradient(0,0,0,TEXTURE_H);
      sea.addColorStop(0,"#12394b"); sea.addColorStop(.5,"#0a2939"); sea.addColorStop(1,"#061a27");
      ctx.fillStyle=sea; ctx.fillRect(0,0,TEXTURE_W,TEXTURE_H);

      ctx.save(); ctx.globalAlpha=.07; ctx.strokeStyle="#d0e5e7"; ctx.lineWidth=1;
      for (let lat=-60;lat<=60;lat+=20) {
        const py=((90-lat)/180)*TEXTURE_H;
        ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(TEXTURE_W,py); ctx.stroke();
      }
      ctx.restore();

      features.forEach(f => drawFeature(ctx,f));
      const texture=new THREE.CanvasTexture(canvas);
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    function buildLabels(features) {
      labelsLayer.replaceChildren();
      labelItems=[];
      for (const name of TARGETS) {
        const f=features.find(feat => featureTargetName(feat)===name);
        if (!f) continue;
        const [lon,lat]=centroidOfFeature(f);
        const [pLon,pLat]=geoToPlanet(lon,lat);
        const el=document.createElement("div");
        el.className="label"; el.textContent=name;
        labelsLayer.appendChild(el);
        labelItems.push({ name,el,local:latLonToVector3(pLat,pLon,RADIUS*1.024) });
      }
    }

    async function loadTaiwan() {
      try {
        const res=await fetch(DATA_URL,{cache:"force-cache"});
        if (!res.ok) throw new Error(`TopoJSON ${res.status}`);
        const topology=await res.json();
        const object=topology.objects.towns || Object.values(topology.objects)[0];
        const collection=topoFeature(topology,object);
        const features=collection.features.filter(isMainIslandFeature);
        if (!features.length) throw new Error("找不到台灣本島行政區");
        projectionState=buildProjection(features);
        const texture=buildTexture(features);
        oceanMaterial.map=texture;
        oceanMaterial.needsUpdate=true;
        buildLabels(features);
        document.body.classList.add("ready");
      } catch (err) {
        console.error(err);
        statusEl.textContent="台灣圖資載入失敗";
      }
    }

    const pointers=new Map();
    let lastSingle=null, pinchStartDistance=0, pinchStartCameraZ=camera.position.z;
    const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    const markInteraction=()=>document.body.classList.add("interacted");

    function onPointerDown(event) {
      event.preventDefault(); markInteraction();
      renderer.domElement.setPointerCapture?.(event.pointerId);
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      document.body.classList.add("dragging");
      if (pointers.size===1) lastSingle={x:event.clientX,y:event.clientY};
      else if (pointers.size===2) {
        const [a,b]=[...pointers.values()];
        pinchStartDistance=Math.max(1,distance(a,b));
        pinchStartCameraZ=camera.position.z;
        lastSingle=null;
      }
    }
    function onPointerMove(event) {
      if (!pointers.has(event.pointerId)) return;
      event.preventDefault();
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if (pointers.size===1) {
        const p=[...pointers.values()][0];
        if (lastSingle) {
          world.rotation.y += (p.x-lastSingle.x)*ROTATION_SPEED;
          world.rotation.x += (p.y-lastSingle.y)*ROTATION_SPEED;
          world.rotation.x=THREE.MathUtils.clamp(world.rotation.x,-1.36,1.36);
        }
        lastSingle={...p};
      } else if (pointers.size===2) {
        const [a,b]=[...pointers.values()];
        const current=Math.max(1,distance(a,b));
        camera.position.z=THREE.MathUtils.clamp(pinchStartCameraZ*(pinchStartDistance/current),MIN_CAMERA_Z,MAX_CAMERA_Z);
      }
    }
    function onPointerUp(event) {
      event.preventDefault(); pointers.delete(event.pointerId);
      if (!pointers.size) { lastSingle=null; document.body.classList.remove("dragging"); }
      else if (pointers.size===1) lastSingle={...[...pointers.values()][0]};
    }
    ["pointerdown","pointermove","pointerup","pointercancel"].forEach(type => {
      renderer.domElement.addEventListener(type,type==="pointerdown"?onPointerDown:type==="pointermove"?onPointerMove:onPointerUp,{passive:false});
    });

    const block=e=>e.preventDefault();
    ["gesturestart","gesturechange","gestureend","contextmenu","dragstart","selectstart"].forEach(type=>document.addEventListener(type,block,{passive:false}));
    document.addEventListener("touchmove",e=>{ if (e.touches.length>1) e.preventDefault(); },{passive:false});
    let lastTouchEnd=0;
    document.addEventListener("touchend",e=>{ const now=Date.now(); if (now-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=now; },{passive:false});

    function resize() {
      const width=window.innerWidth, height=window.innerHeight;
      camera.aspect=width/Math.max(1,height); camera.updateProjectionMatrix();
      renderer.setSize(width,height,false); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    }
    window.addEventListener("resize",resize,{passive:true});
    window.visualViewport?.addEventListener("resize",resize,{passive:true});
    resize();

    const tmpWorld=new THREE.Vector3(), tmpProjected=new THREE.Vector3(), tmpNormal=new THREE.Vector3(), tmpToCamera=new THREE.Vector3();
    function updateLabels() {
      const width=window.innerWidth,height=window.innerHeight;
      world.updateMatrixWorld(true);
      for (const label of labelItems) {
        tmpWorld.copy(label.local).applyMatrix4(world.matrixWorld);
        tmpNormal.copy(tmpWorld).normalize(); tmpToCamera.copy(camera.position).sub(tmpWorld).normalize();
        const facing=tmpNormal.dot(tmpToCamera);
        if (facing<=.035) { label.el.style.opacity="0"; continue; }
        tmpProjected.copy(tmpWorld).project(camera);
        const sx=(tmpProjected.x*.5+.5)*width, sy=(-tmpProjected.y*.5+.5)*height;
        if (tmpProjected.z < -1 || tmpProjected.z > 1 || sx < -80 || sx > width+80 || sy < -50 || sy > height+50) { label.el.style.opacity="0"; continue; }
        label.el.style.transform=`translate3d(${sx}px,${sy}px,0) translate(-50%,-50%)`;
        label.el.style.opacity=String(THREE.MathUtils.clamp((facing-.035)*2.9,0,1));
      }
    }
    function animate() { updateLabels(); renderer.render(scene,camera); requestAnimationFrame(animate); }
    animate();
    loadTaiwan();
  </script>
</body>
</html>
