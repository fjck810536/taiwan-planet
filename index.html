<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#176fa5">
<title>Taiwan Planet</title>
<style>:root { color-scheme: dark; --bg:#061018; --label:#fffdf2; } * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; } body { position:fixed; inset:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC","PingFang TC",sans-serif; } #app,#stage,#labels { position:absolute; inset:0; width:100%; height:100%; touch-action:none; } #app { overflow:hidden; background:radial-gradient(circle at 50% 42%,rgba(53,129,176,.18),transparent 42%), linear-gradient(180deg,#07141e,#02070b); } canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; } body.dragging canvas { cursor:grabbing; } #labels { z-index:3; pointer-events:none; overflow:hidden; } .label { position:absolute; left:0; top:0; transform:translate(-50%,-50%); white-space:nowrap; color:var(--label); font-size:12px; line-height:1; font-weight:700; letter-spacing:.04em; text-shadow:0 1px 3px #000,0 0 9px rgba(0,0,0,.9); opacity:0; will-change:transform,opacity; } .label.pole { font-size:clamp(13px,3.2vw,18px); letter-spacing:.08em; } .label::before { content:""; position:absolute; left:50%; top:calc(100% + 4px); width:3px; height:3px; border-radius:50%; transform:translateX(-50%); background:currentColor; box-shadow:0 0 0 2px rgba(4,18,28,.72); opacity:.76; } .pole-point { position:absolute; left:0; top:0; width:9px; height:9px; border-radius:50%; transform:translate(-50%,-50%); background:var(--label); box-shadow:0 0 0 3px rgba(4,18,28,.78),0 0 12px rgba(255,253,242,.65); opacity:0; will-change:transform,opacity; } .pole-point.south { width:8px; height:8px; opacity:0; }
#compass { position:absolute; z-index:5; right:max(18px,calc(env(safe-area-inset-right) + 14px)); bottom:max(22px,calc(env(safe-area-inset-bottom) + 16px)); width:58px; height:58px; padding:0; border:0; border-radius:50%; background:rgba(3,12,18,.34); box-shadow:0 3px 14px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.08); pointer-events:auto; cursor:pointer; touch-action:manipulation; -webkit-appearance:none; appearance:none; opacity:.94; }
#compass:active { transform:scale(.96); }
#compassNeedle { position:absolute; left:50%; top:50%; width:24px; height:46px; transform:translate(-50%,-50%); transform-origin:50% 50%; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); background:linear-gradient(to bottom,#d7473f 0 50%,#f6f1e8 50% 100%); filter:drop-shadow(0 1px 1px rgba(0,0,0,.82)) drop-shadow(0 0 2px rgba(255,255,255,.24)); will-change:transform; }
#compassNeedle::after { content:""; position:absolute; left:50%; top:50%; width:5px; height:5px; border-radius:50%; transform:translate(-50%,-50%); background:#17212a; box-shadow:0 0 0 1px rgba(255,255,255,.64); }
#compass.unstable { box-shadow:0 3px 14px rgba(0,0,0,.28),0 0 13px rgba(215,71,63,.22),inset 0 0 0 1px rgba(255,255,255,.10); }
#compass.chaotic { box-shadow:0 3px 14px rgba(0,0,0,.28),0 0 20px rgba(215,71,63,.38),inset 0 0 0 1px rgba(255,255,255,.12); }
</style>
</head>
<body>
<main id="app" aria-label="Taiwan Planet interactive globe"><div id="stage"></div><div id="labels" aria-hidden="true"></div><button id="compass" type="button" aria-label="將北方對齊畫面上方"><span id="compassNeedle" aria-hidden="true"></span></button></main>
<script type="module" src="./feedback/ultralite.js"></script>
</body>
</html>
