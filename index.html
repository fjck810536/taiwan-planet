<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#176fa5">
<title>Taiwan Planet</title>
<style>:root { color-scheme: dark; --bg:#061018; --label:#fffdf2; } * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; } body { position:fixed; inset:0; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans TC","PingFang TC",sans-serif; } #app,#stage,#labels { position:absolute; inset:0; width:100%; height:100%; touch-action:none; } #app { overflow:hidden; background:radial-gradient(circle at 50% 42%,rgba(53,129,176,.18),transparent 42%), linear-gradient(180deg,#07141e,#02070b); } canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; } body.dragging canvas { cursor:grabbing; } #labels { z-index:3; pointer-events:none; overflow:hidden; } .label { position:absolute; left:0; top:0; transform:translate(-50%,-50%); white-space:nowrap; color:var(--label); font-size:12px; line-height:1; font-weight:700; letter-spacing:.04em; text-shadow:0 1px 3px #000,0 0 9px rgba(0,0,0,.9); opacity:0; will-change:transform,opacity; } .label.pole { font-size:clamp(13px,3.2vw,18px); letter-spacing:.08em; } .label::before { content:""; position:absolute; left:50%; top:calc(100% + 4px); width:3px; height:3px; border-radius:50%; transform:translateX(-50%); background:currentColor; box-shadow:0 0 0 2px rgba(4,18,28,.72); opacity:.76; } #hint,#status { position:absolute; z-index:4; left:50%; transform:translateX(-50%); pointer-events:none; text-align:center; white-space:nowrap; text-shadow:0 1px 3px #000; } #hint { bottom:max(18px,calc(env(safe-area-inset-bottom) + 12px)); color:rgba(244,248,245,.7); font-size:11px; letter-spacing:.08em; transition:opacity .35s ease; } #status { top:max(18px,calc(env(safe-area-inset-top) + 10px)); color:rgba(244,248,245,.8); font-size:11px; letter-spacing:.06em; } body.interacted #hint { opacity:0; } body.ready #status { opacity:0; transition:opacity .45s ease; }</style>
</head>
<body>
<main id="app" aria-label="Taiwan Planet interactive globe"><div id="stage"></div><div id="labels" aria-hidden="true"></div><div id="status">載入台灣行政區…</div><div id="hint">單指旋轉・雙指縮放</div></main>
<script type="module" src="./app.js"></script>
</body>
</html>
