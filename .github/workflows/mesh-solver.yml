name: Build constrained Taiwan mesh

on:
  push:
    paths:
      - 'mesh_solver/solve_mesh.py'
      - 'mesh_solver/solve_mesh_v2.py'
      - 'mesh_solver/solve_mesh_v3.py'
      - 'mesh_solver/solve_mesh_v4.py'
      - 'mesh_solver/solve_mesh_v5.py'
      - 'mesh_solver/solve_mesh_v6.py'
      - 'mesh_solver/policy.json'
      - 'mesh_solver/viewer.js'
      - 'mesh_solver/index.html'
      - '.github/workflows/mesh-solver.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy shapely
      - run: python mesh_solver/solve_mesh_v6.py
      - name: Commit generated mesh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mesh_solver/generated/mesh.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate constrained Taiwan mesh"
            git push
          fi
