name: Bake ultralite Taiwan map

on:
  push:
    branches:
      - main
    paths:
      - feedback/geo.js
      - feedback/solver.js
      - feedback/solver_v2.js
      - scripts/bake-ultralite.mjs
      - config/offshore-cartogram.mjs
      - .github/workflows/bake-ultralite.yml

permissions:
  contents: write

concurrency:
  group: taiwan-planet-bake-main
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build-only dependencies
        run: npm install --no-save --package-lock=false three@0.180.0 topojson-client@3

      - name: Bake static map geometry
        run: node scripts/bake-ultralite.mjs

      - name: Commit baked assets
        run: |
          git config user.name "taiwan-planet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add baked/map.bin baked/meta.json
          if git diff --cached --quiet; then
            echo "Baked assets unchanged."
            exit 0
          fi
          git commit -m "Bake ultralite Taiwan geometry"
          git pull --rebase origin main
          git push origin HEAD:main
